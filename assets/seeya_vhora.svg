<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 75" width="100%" height="75" style="background: transparent;">
  <defs>
    <linearGradient id="hotPinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="25%" stop-color="#FF69B4" />
      <stop offset="50%" stop-color="#FFA8D8" />
      <stop offset="75%" stop-color="#FF69B4" />
      <stop offset="100%" stop-color="#FF1493" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes pulseSparkle {
        0%, 100% { opacity: 0.6; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #FF1493); }
      }
      .sparkle-left {
        transform-origin: 50px 38px;
        animation: pulseSparkle 2s ease-in-out infinite;
      }
      .sparkle-right {
        transform-origin: 630px 38px;
        animation: pulseSparkle 2s ease-in-out 1s infinite;
      }
    </style>
  </defs>

  <!-- Left Pixel Sparkle -->
  <g class="sparkle-left">
    <rect x="48" y="30" width="4" height="16" fill="#FF1493" />
    <rect x="42" y="36" width="16" height="4" fill="#FF1493" />
    <rect x="46" y="34" width="8" height="8" fill="#FFFFFF" />
  </g>

